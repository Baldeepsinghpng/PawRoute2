<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — PawRoute</title>
<meta name="description" content="Join the PawRoute early-access waitlist or get in touch.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="page-hero center"><div class="wrap">
  <span class="eyebrow rv"><b></b> Early access open</span>
  <h1 class="rv d1" style="margin:1.2rem 0">Let's get your van <span class="grad">on the map.</span></h1>
  <p class="lead rv d2">Tell us about your business and we will reach out with an invite.</p>
</div></header>

<section style="padding-top:30px"><div class="wrap grid g2" style="align-items:start">
  <form class="card rv" id="contact-form">
    <label for="name">Your name</label><input id="name" name="name" required placeholder="Mari Tamm">
    <label for="biz">Salon or van name</label><input id="biz" name="biz" placeholder="Happy Paws Mobile">
    <label for="msg">How can we help?</label><textarea id="msg" name="msg" required placeholder="How many dogs per day, which city, biggest routing headache..."></textarea>
    <br><button class="btn" type="submit">Send message 🐾</button>
  </form>
  <div class="grid rv d1">
    <div class="card"><div class="ic">✉️</div><h3>Email</h3><p>hello@pawroute.example</p></div>
    <div class="card"><div class="ic">📍</div><h3>Based in</h3><p>Estonia, serving groomers across Europe.</p></div>
    <div class="card"><div class="ic">⚡</div><h3>Reply time</h3><p>Within one working day.</p></div>
  </div>
</div></section>
<script src="script.js"></script>
</body>
</html>
